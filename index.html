    <script>
        // Initialisation de la date sur la date réelle
        let currentDate = new Date();
        let activeSheetDate = null;
        let lastDirection = 'right';

        // Tableaux vierges initialisés via LocalStorage ou vides par défaut
        let events = JSON.parse(localStorage.getItem('bcb_agenda_clean_events')) || [];
        let tasks = JSON.parse(localStorage.getItem('bcb_agenda_clean_tasks')) || [];

        const monthNames = ["Janvier", "Février", "Mars", "Avril", "Mai", "Juin", "Juillet", "Août", "Septembre", "Octobre", "Novembre", "Décembre"];

        document.addEventListener('DOMContentLoaded', () => {
            renderCalendar();
            renderTasks();
        });

        // Mode Sombre / Clair
        document.getElementById('themeToggle').addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
        });

        function changeMonth(delta) {
            lastDirection = delta > 0 ? 'right' : 'left';
            currentDate.setMonth(currentDate.getMonth() + delta);
            renderCalendar();
        }

        function goToToday() {
            lastDirection = 'right';
            currentDate = new Date();
            renderCalendar();
        }

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            document.getElementById('yearLabel').innerText = year;
            document.getElementById('monthTitle').innerText = monthNames[month];
            
            const nextMonth = new Date(year, month + 1, 1);
            document.getElementById('nextMonthIndicator').innerText = monthNames[nextMonth.getMonth()];

            const grid = document.getElementById('monthGrid');
            
            // Animation de transition
            grid.classList.remove('animate-slide-left', 'animate-slide-right');
            void grid.offsetWidth; // Force le recalcul
            grid.classList.add(lastDirection === 'right' ? 'animate-slide-left' : 'animate-slide-right');

            grid.innerHTML = '';

            const firstDayIndex = (new Date(year, month, 1).getDay() + 6) % 7;
            const totalDays = new Date(year, month + 1, 0).getDate();
            const prevMonthDays = new Date(year, month, 0).getDate();

            // Jours du mois précédent
            for (let i = firstDayIndex - 1; i >= 0; i--) {
                const cell = createCell(prevMonthDays - i, true);
                grid.appendChild(cell);
            }

            // Jours du mois courant
            const today = new Date();
            for (let day = 1; day <= totalDays; day++) {
                const isToday = (day === today.getDate() && month === today.getMonth() && year === today.getFullYear());
                const cell = createCell(day, false, isToday, year, month);
                grid.appendChild(cell);
            }

            // Remplissage fin de grille
            const totalCells = firstDayIndex + totalDays;
            const remaining = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
            for (let day = 1; day <= remaining; day++) {
                const cell = createCell(day, true);
                grid.appendChild(cell);
            }
        }

        function createCell(dayNum, isDisabled, isToday = false, year = null, month = null) {
            const cell = document.createElement('div');
            cell.className = `min-h-[92px] p-1 flex flex-col items-center rounded-2xl transition-all ${isDisabled ? 'opacity-20 pointer-events-none' : 'hover:bg-slate-50 dark:hover:bg-zinc-800/40 cursor-pointer active:scale-95'}`;

            // Numéro du jour
            const numSpan = document.createElement('span');
            numSpan.className = `text-sm font-extrabold w-7 h-7 flex items-center justify-
